[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "finir"
dynamic = ["version"]
description = "A financial intermediate representation and incremental execution runtime for AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FinIR Contributors" }]
maintainers = [{ name = "Olyxee" }]
keywords = [
    "financial-computation",
    "intermediate-representation",
    "compiler",
    "incremental-computation",
    "scenario-analysis",
    "ai-infrastructure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]

# Core stays lightweight and CPU-first: NumPy for the reference/vectorized CPU
# backends, and Typer + Rich so the `finir` console script works out of the box
# (they are small, pure-Python, and the CLI is a first-class part of the release).
# Everything heavier — GPU, graph rendering, dev tooling — is an optional extra.
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]     # optional GPU backend; never required (see docs/backends.md)
viz = ["graphviz>=0.20"]          # optional SVG rendering (DOT export itself needs nothing)
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
    "jsonschema>=4.21",
]

[project.scripts]
finir = "finir.cli.main:main"

[project.urls]
Homepage = "https://github.com/Olyxee/finir"
Repository = "https://github.com/Olyxee/finir"
Documentation = "https://github.com/Olyxee/finir/tree/main/docs"
Changelog = "https://github.com/Olyxee/finir/blob/main/CHANGELOG.md"
Issues = "https://github.com/Olyxee/finir/issues"

# The authoritative version lives in src/finir/version.py (single source of truth).
[tool.hatch.version]
path = "src/finir/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/finir"]
# Ship the canonical intent JSON Schema as package data (loaded at runtime via
# importlib.resources, never a repo-relative path).
artifacts = ["src/finir/intent/*.json"]

[tool.hatch.build.targets.sdist]
include = [
    "src/finir",
    "tests",
    "benchmarks",
    "research",
    "docs",
    "examples",
    "schemas",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = [
    "E501",    # line length is owned by the formatter
    "PLR0913", # wide constructors are fine
    "PLR2004", # magic values fine in tests/benchmarks/formulas
    "PLR0912", # branchy compiler/runtime code
    "PLR0915",
    "PLR0911",
    "PLC0415", # lazy/optional imports are intentional
    "PLW0603", # module-level default registries are intentional singletons
    "PLW0108", # small lambdas for kernel fns read fine
    "PLW2901", # loop-var reuse in parsers is local and clear
    "B008",    # typer Option()/Argument() defaults are the framework idiom
    "C416",    # occasional explicit comprehensions kept for clarity
    "C401",
    "C901",
    "RUF001",  # ambiguous unicode in finance docstrings (×, →) is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["finir"]

[tool.mypy]
# 3.12 so mypy can parse NumPy 2.x's PEP 695 stubs; runtime still targets 3.11.
python_version = "3.12"
packages = ["finir"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["finir"]
branch = true

[tool.coverage.report]
show_missing = true
