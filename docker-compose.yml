# Economic Intelligence Framework — local stack.
#
#   docker compose up                 # API on SQLite (no external services)
#   docker compose --profile pg up    # API on PostgreSQL
#
# There is deliberately no frontend — this is infrastructure.

services:
  api:
    build: .
    image: eif:local
    ports:
      - "8000:8000"
    environment:
      EIF_ORGANIZATION_ID: demo-org
      EIF_ORGANIZATION_CURRENCY: ZAR
      EIF_LOG_FORMAT: json
      # Default: local SQLite. Overridden to Postgres under the "pg" profile below.
      EIF_DATABASE_URL: ${EIF_DATABASE_URL:-sqlite:////app/data/eif.db}
    volumes:
      - eif-data:/app/data
    restart: unless-stopped

  # Optional PostgreSQL, enabled only with `--profile pg`.
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: eif
      POSTGRES_PASSWORD: eif
      POSTGRES_DB: eif
    ports:
      - "5432:5432"
    volumes:
      - eif-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eif"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API wired to Postgres (use with `--profile pg`).
  api-pg:
    extends: api
    profiles: ["pg"]
    environment:
      EIF_DATABASE_URL: postgresql+psycopg://eif:eif@postgres:5432/eif
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eif-data:
  eif-pg:
