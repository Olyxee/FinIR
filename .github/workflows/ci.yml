name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: pytest --cov=eif --cov-report=xml --cov-report=term

      - name: Benchmark smoke
        run: |
          eif benchmark generate benchmarks/cases
          eif benchmark run --cases benchmarks/cases --json > /dev/null

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eif:ci .
      - name: Smoke-test container health
        run: |
          docker run -d --name eif -p 8000:8000 eif:ci
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/health; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs eif
          exit 1
