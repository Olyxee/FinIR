name: Bug report
description: Report a defect in FinIR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include secrets or real
        proprietary financial data — use a minimal synthetic model.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: FinIR produced ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest Python or .finir model + command that reproduces it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FinIR version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python / OS / NumPy
      placeholder: "3.11 / Ubuntu 24.04 / numpy 2.1"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - cpu (default)
        - gpu (cupy)
    validations:
      required: true
